<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>BLE Locate</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 21 19H3Z"/><circle cx="12" cy="14" r="2"/></svg>
      <span>BLE Locate</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-tab="live" aria-controls="view-live">Live</button>
      <button type="button" role="tab" data-tab="devices" aria-controls="view-devices">Devices</button>
      <button type="button" role="tab" data-tab="connect" aria-controls="view-connect">Connect</button>
      <button type="button" role="tab" data-tab="settings" aria-controls="view-settings">Settings</button>
      <button type="button" role="tab" data-tab="calibrate" aria-controls="view-calibrate">Calibrate</button>
    </nav>
    <p id="hub-link" class="hub-link" role="status">Connecting to P1…</p>
  </header>
  <p id="banner" class="banner" role="alert" hidden></p>

  <main>
    <section id="view-live" class="view live" role="tabpanel" aria-label="Live">
      <figure class="plan">
        <svg id="plan" role="img" aria-label="Room plan"></svg>
        <figcaption id="readout" class="readout" aria-live="polite">Waiting for P1…</figcaption>
      </figure>
      <div id="anchors" class="anchors" aria-label="Anchors"></div>
    </section>

    <section id="view-devices" class="view" role="tabpanel" aria-label="Devices" hidden>
      <div class="device-head">
        <h2>Nearby devices</h2>
        <p class="muted">The list holds still: new devices are added at the bottom, and quiet ones fade instead of disappearing. Sort by signal to tidy it.</p>
        <div class="row device-tools">
          <label class="visually-hidden" for="device-filter">Filter devices</label>
          <input id="device-filter" type="search" placeholder="Filter by name, address or maker" autocomplete="off" spellcheck="false">
          <label class="check-label"><input id="device-named" type="checkbox"> Hide unnamed devices</label>
          <button id="device-sort" type="button">Sort by signal</button>
        </div>
        <p id="device-summary" class="device-summary" role="status"></p>
        <p id="device-note" role="status"></p>
      </div>
      <div class="device device-cols" aria-hidden="true"><span>Device</span><span>Signal</span><span>Heard by each anchor (dBm)</span><span>Last heard</span><span></span></div>
      <ol id="device-list" class="device-list" aria-label="Nearby devices"></ol>
    </section>

    <section id="view-connect" class="view columns" role="tabpanel" aria-label="Connect" hidden>
      <div id="connect-info"><p>Loading P1's network addresses…</p></div>
      <div id="phone-anchor"></div>
    </section>

    <section id="view-settings" class="view" role="tabpanel" aria-label="Settings" hidden>
      <form id="settings-form" class="settings" novalidate><p>Loading settings…</p></form>
    </section>

    <section id="view-calibrate" class="view narrow" role="tabpanel" aria-label="Calibrate" hidden>
      <div id="calibration"></div>
    </section>
  </main>
  <noscript><p class="banner">This dashboard needs JavaScript.</p></noscript>
</body>
</html>
